# Пример: фрагмент для /etc/nginx/sites-enabled/otiva
# Вставить в server { } с listen 443 ssl (НЕ в редирект с 80 на 443).

server {
    listen 443 ssl http2;
    server_name nashlo.ru www.nashlo.ru;

    # ... ssl_certificate и прочее ...

    # OTIVA SEO static (robots.txt trailing slash fix)
    location = /robots.txt {
        alias /root/OTIVA/public/robots.txt;
        default_type text/plain;
        add_header Cache-Control "public, max-age=0";
    }

    location = /robots.txt/ {
        alias /root/OTIVA/public/robots.txt;
        default_type text/plain;
        add_header Cache-Control "public, max-age=0";
    }

    location = /favicon.ico {
        alias /root/OTIVA/public/favicon.ico;
        expires 7d;
    }

    location = /favicon.ico/ {
        alias /root/OTIVA/public/favicon.ico;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
