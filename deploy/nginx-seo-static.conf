# Обязательно, если /robots.txt → 200, а /robots.txt/ → 308 (типично: nginx отдаёт
# public/robots.txt, а запрос со слэшем уходит в Next.js).
# Вставить ВНУТРЬ server { ... } ПЕРЕД location / { proxy_pass ... }
#
# После правки: nginx -t && systemctl reload nginx
# Проверка: curl -I https://nashlo.ru/robots.txt/  → должен быть HTTP/2 200

location = /robots.txt {
    alias /root/OTIVA/public/robots.txt;
    default_type text/plain;
    add_header Cache-Control "public, max-age=0";
}

location = /robots.txt/ {
    alias /root/OTIVA/public/robots.txt;
    default_type text/plain;
    add_header Cache-Control "public, max-age=0";
}

location = /favicon.ico {
    alias /root/OTIVA/public/favicon.ico;
    expires 7d;
}

location = /favicon.ico/ {
    alias /root/OTIVA/public/favicon.ico;
    expires 7d;
}
